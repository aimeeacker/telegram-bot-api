name: Build and Publish Telegram Bot API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: telegram-bot-api-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'all' || inputs.mode == 'ubuntu' }}
    name: Build linux x86_64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Clean runner space
        uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Configure Release build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX:PATH="${{ github.workspace }}/dist"

      - name: Build and install
        run: cmake --build build --target install -j 4

      - name: Verify binary
        run: |
          ls -lh dist/bin/telegram-bot-api
          file dist/bin/telegram-bot-api
          ldd dist/bin/telegram-bot-api
          dist/bin/telegram-bot-api --version

      - name: Test MCP HTTP parsing and compatibility
        run: python3 tests/mcp_http.py dist/bin/telegram-bot-api

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-bot-api-linux-x86_64
          path: dist/bin/telegram-bot-api
          if-no-files-found: error
          retention-days: 14

  docker:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'all' || inputs.mode == 'docker' }}
    name: Publish OpenWrt x86_64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clean runner space
        uses: mathio/gha-cleanup@v1
        with:
          remove-browsers: true
          verbose: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_JOBS=4
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
