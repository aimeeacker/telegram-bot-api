name: Prebuild TDLib Static Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-glibc:
    name: Build TDLib (glibc)
    runs-on: ubuntu-24.04

    steps:
      - name: Clean runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make git zlib1g-dev libssl-dev gperf cmake g++

      - name: Patch TDLib for MCP support
        run: python3 scripts/patch-tdlib-mcp.py

      - name: Build TDLib static libraries
        run: |
          cmake -S td -B build-td -DCMAKE_BUILD_TYPE=Release
          cmake --build build-td --target tdactor tdcore tddb tdnet tdutils memprof -j 4

      - name: Package glibc bundle
        run: |
          mkdir -p dist/lib dist/include/td dist/include/memprof
          find build-td -name "*.a" -exec cp {} dist/lib/ \;
          cp -r td/tdactor/td/actor dist/include/td/
          cp -r td/tddb/td/db dist/include/td/
          cp -r td/tdnet/td/net dist/include/td/
          cp -r td/tdutils/td/utils dist/include/td/
          cp -r td/td/telegram dist/include/td/
          cp -r td/td/tl dist/include/td/
          cp -r td/tdtl/td/tl/* dist/include/td/tl/
          cp td/memprof/*.h dist/include/memprof/
          find build-td -name "config.h" -exec cp {} dist/include/td/utils/ \;
          if [ -d td/td/generate/auto/td/telegram ]; then
            cp -r td/td/generate/auto/td/telegram/* dist/include/td/telegram/
          fi
          find dist/include -type f \( -name "*.cpp" -o -name "*.c" \) -delete

          cat <<EOF > dist/MANIFEST.json
          {
            "target": "linux-x86_64-glibc",
            "td_submodule_commit": "$(git rev-parse :td)",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runner_os": "${{ runner.os }}",
            "compiler": "$(g++ --version | head -n 1)",
            "libc": "glibc",
            "cmake_version": "$(cmake --version | head -n 1)"
          }
          EOF

          tar -czvf tdlib-x86_64-linux-glibc.tar.gz -C dist lib include MANIFEST.json
          ls -lh tdlib-x86_64-linux-glibc.tar.gz

      - name: Upload glibc artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-glibc
          path: tdlib-x86_64-linux-glibc.tar.gz
          retention-days: 1

  build-musl:
    name: Build TDLib (musl)
    runs-on: ubuntu-24.04

    steps:
      - name: Clean runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Patch TDLib for MCP support
        run: python3 scripts/patch-tdlib-mcp.py

      - name: Build TDLib static libraries in Alpine container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            alpine:3.20 \
            sh -c "
              set -e
              apk add --no-cache bash git gperf cmake make g++ zlib-dev openssl-dev linux-headers tar
              git config --global --add safe.directory /workspace
              cmake -S td -B build-td-musl -DCMAKE_BUILD_TYPE=Release
              cmake --build build-td-musl --target tdactor tdcore tddb tdnet tdutils memprof -j 4
            "

      - name: Package musl bundle
        run: |
          mkdir -p dist/lib dist/include/td dist/include/memprof
          find build-td-musl -name "*.a" -exec cp {} dist/lib/ \;
          cp -r td/tdactor/td/actor dist/include/td/
          cp -r td/tddb/td/db dist/include/td/
          cp -r td/tdnet/td/net dist/include/td/
          cp -r td/tdutils/td/utils dist/include/td/
          cp -r td/td/telegram dist/include/td/
          cp -r td/td/tl dist/include/td/
          cp -r td/tdtl/td/tl/* dist/include/td/tl/
          cp td/memprof/*.h dist/include/memprof/
          find build-td-musl -name "config.h" -exec cp {} dist/include/td/utils/ \;
          if [ -d td/td/generate/auto/td/telegram ]; then
            cp -r td/td/generate/auto/td/telegram/* dist/include/td/telegram/
          fi
          find dist/include -type f \( -name "*.cpp" -o -name "*.c" \) -delete

          cat <<EOF > dist/MANIFEST.json
          {
            "target": "linux-x86_64-musl",
            "td_submodule_commit": "$(git rev-parse :td)",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runner_os": "alpine",
            "compiler": "gcc (Alpine 13.2.1)",
            "libc": "musl",
            "cmake_version": "cmake (Alpine 3.29)"
          }
          EOF

          tar -czvf tdlib-x86_64-linux-musl.tar.gz -C dist lib include MANIFEST.json
          ls -lh tdlib-x86_64-linux-musl.tar.gz

      - name: Upload musl artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-musl
          path: tdlib-x86_64-linux-musl.tar.gz
          retention-days: 1

  release:
    name: Publish Release Assets
    needs: [build-glibc, build-musl]
    runs-on: ubuntu-24.04

    steps:
      - name: Clean runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download glibc artifact
        uses: actions/download-artifact@v8
        with:
          name: tdlib-glibc

      - name: Download musl artifact
        uses: actions/download-artifact@v8
        with:
          name: tdlib-musl

      - name: Compute checksums
        run: |
          sha256sum tdlib-x86_64-linux-glibc.tar.gz tdlib-x86_64-linux-musl.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TD_COMMIT=$(git rev-parse :td)
          TAG_NAME="tdlib-${TD_COMMIT:0:7}"
          TITLE="Precompiled TDLib (${TAG_NAME})"
          BODY="Precompiled TDLib static libraries for TDLib submodule commit \`${TD_COMMIT}\`."

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists, uploading assets..."
            gh release upload "$TAG_NAME" --clobber \
              tdlib-x86_64-linux-glibc.tar.gz \
              tdlib-x86_64-linux-musl.tar.gz \
              SHA256SUMS.txt
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "$TITLE" \
              --notes "$BODY" \
              tdlib-x86_64-linux-glibc.tar.gz \
              tdlib-x86_64-linux-musl.tar.gz \
              SHA256SUMS.txt
          fi
